name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Streamlit dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r streamlit_app/requirements.txt

      - name: Validate Python syntax
        run: |
          python -m compileall streamlit_app lambdas glue_jobs

      - name: Validate Step Functions JSON
        run: |
          python -m json.tool step_functions/wistia_state_machine.json >/dev/null
        continue-on-error: true
